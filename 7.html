<!DOCTYPE html>
<html>
<head>
    <title>Addition using Event Handling</title>
</head>
<body>

    <h2>Add Two Numbers</h2>

    <label>Enter First Number</label>
    <input type="number" id="num1" oninput="calculate()">
    <br><br>

    <label>Enter Second Number</label>
    <input type="number" id="num2" oninput="calculate()">
    <br><br>

    <label>Result</label>
    <input type="text" id="result" readonly>

    <script>
        function calculate() {

            let first = document.getElementById("num1").value;
            let second = document.getElementById("num2").value;

            if (first === "" || second === "") {
                document.getElementById("result").value = "NaN";
            }
            else {
                let sum = Number(first) + Number(second);
                document.getElementById("result").value = sum;
            }
        }
    </script>

</body>
</html>
